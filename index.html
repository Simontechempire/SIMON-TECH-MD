<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SIMON TECH MD - Pairing</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#02020a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.container{max-width:450px;width:100%;background:#0a0a1a;border:1px solid #00d9ff44;border-radius:20px;padding:30px;box-shadow:0 0 40px #00d9ff22}.logo{text-align:center}.logo h1{color:#00e5ff;font-size:28px}.code-box{margin-top:20px;padding:20px;background:#000;border:1px dashed #00e5ff66;border-radius:12px;text-align:center;display:none}.code{font-size:32px;letter-spacing:6px;color:#00e5ff;font-weight:bold}input{width:100%;padding:15px;background:#111122;border:1px solid #00d9ff33;border-radius:12px;color:#fff;margin:15px 0}button{width:100%;padding:16px;background:linear-gradient(90deg,#00d9ff,#0066ff);border:none;border-radius:12px;color:#fff;font-weight:bold;cursor:pointer}.instruct{margin-top:15px;font-size:13px;color:#ccc;background:#111122;padding:15px;border-radius:10px}</style></head><body>
<div class="container"><div class="logo"><h1>SIMON TECH MD</h1><p>PERMANENT • NO 60s EXPIRY</p></div>
<input type="text" id="number" placeholder="23408122029123" />
<button onclick="getCode()">GET PAIRING CODE</button>
<div class="code-box" id="codeBox"><h2>YOUR CODE</h2><div class="code" id="pairCode">---- ----</div><div class="instruct">WhatsApp > Linked Devices > Link with Phone Number<br><br>Pair ONCE = stays forever on Back4app</div></div></div>
<script>async function getCode(){const n=document.getElementById('number').value.trim();const b=document.getElementById('codeBox');const c=document.getElementById('pairCode');if(!n){alert('Enter number');return}c.innerText='Generating...';b.style.display='block';try{const r=await fetch('/pair?number='+n);const t=await r.text();const m=t.match(/[A-Z0-9]{4}-[A-Z0-9]{4}|[A-Z0-9]{8}/);c.innerText=m?m[0]:t}catch(e){c.innerText='Failed'}}</script></body></html>
